name: Deploying to AzureVM

on:
  workflow_dispatch:

jobs:
  ssh-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Run commands on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
          set -e

          echo "Cloning scripts repo..."
          git clone https://github.com/yashaswi29/install_scripts.git || true
          cd install_scripts

          echo "Making scripts executable..."
          chmod +x install_docker.sh install_tutor.sh lms.sh

          echo "Installing Docker..."
          bash install_docker.sh

          echo "Adding user to Docker group..."
          sudo usermod -aG docker $USER
          sudo systemctl enable docker
          sudo systemctl start docker

          echo "Cleaning Docker system to free space..."
          sudo docker builder prune -af
          sudo docker system prune -af --volumes

          echo "Available space:"
          df -h /

          echo "Running Tutor install..."
          bash install_tutor.sh

          echo "Launching LMS..."
          bash lms.sh
          EOF
