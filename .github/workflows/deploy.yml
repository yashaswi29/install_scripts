name: Deploying to AzureVM

on:
  workflow_dispatch:

jobs:
  ssh-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Run commands on VM
        run: |
          ssh azureuser@${{ secrets.VM_HOST }} << 'EOF'
          set -e

          git clone https://github.com/yashaswi29/install_scripts.git
          cd install_scripts

          chmod +x install_docker.sh install_tutor.sh lms.sh

          bash install_docker.sh

          sudo usermod -aG docker $USER
          sudo systemctl enable docker
          sudo systemctl start docker
          sudo systemctl status docker

          # Apply group changes for current session
          newgrp docker << 'DOCKER_COMMANDS'
          bash install_tutor.sh
          bash lms.sh
          DOCKER_COMMANDS
          
          EOF