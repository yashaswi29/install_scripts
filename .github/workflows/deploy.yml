name: Deploying to AzureVM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: First SSH - Docker Installation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120m
          script: |
            set -euxo pipefail

            # Clone repo or pull latest
            if [ -d install_scripts ]; then
              cd install_scripts && git pull
            else
              git clone https://github.com/yashaswi29/install_scripts.git
              cd install_scripts
            fi

            chmod +x install_docker.sh

            echo "Installing Docker..."
            ./install_docker.sh

            echo "Adding user to docker group and enabling Docker..."
            sudo usermod -aG docker $(whoami)
            sudo systemctl enable --now docker

            echo "Cleanup Docker cache..."
            sudo docker builder prune -af
            sudo docker system prune -af --volumes

      - name: Pause for usermod to take effect (wait ~10s)
        run: sleep 10

      - name: Second SSH - Tutor + LMS Installation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 7200
          script: |
            set -euxo pipefail

            cd ~/install_scripts || exit 1

            chmod +x install_tutor.sh lms.sh

            echo "Installing Tutor..."
            ./install_tutor.sh

            echo "Running LMS setup..."
            ./lms.sh
